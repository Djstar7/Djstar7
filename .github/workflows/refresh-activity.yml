name: Refresh GitHub snapshot

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-activity.yml"
      - "scripts/**"
      - "profile.json"

permissions:
  contents: read

concurrency:
  group: profile-snapshot
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'Djstar7/Djstar7' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Generate public repository snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_activity.py
      - name: Validate
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/validate_profile.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: profile-snapshot
          path: |
            assets/generated/
            README.md
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: profile-snapshot
          path: .
      - name: Commit only the snapshot and README block
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/generated/ README.md
          if git diff --cached --quiet; then
            echo "Snapshot already current."
            exit 0
          fi
          git commit -m "chore: refresh GitHub snapshot"
          git push origin HEAD:main
