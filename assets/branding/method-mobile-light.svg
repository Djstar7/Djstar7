<svg xmlns="http://www.w3.org/2000/svg" width="480" height="616" viewBox="0 0 480 616" role="img" aria-labelledby="title desc">
<title id="title">Méthode et principes</title><desc id="desc">Product cycle: Comprendre → Concevoir → Développer → Tester → Déployer → Faire évoluer, then back to understanding. Principles: Security by Design; Séparation des responsabilités; Validation stricte des entrées; Transactions maîtrisées; Tests automatisés.</desc>
